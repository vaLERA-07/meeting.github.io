<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Приглашение ❤️</title>
  
  <!-- Подключаем Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe6f0 0%, #ffb6c1 100%);
      padding: 16px;
      overflow: hidden;
    }

    /* Основная карточка */
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px 24px 36px;
      border-radius: 48px 48px 48px 12px;
      box-shadow: 0 30px 60px rgba(255, 50, 100, 0.3);
      text-align: center;
      position: relative;
      z-index: 10;
      transition: 0.5s;
    }

    /* Фото */
    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff2d75;
      box-shadow: 0 8px 20px rgba(255, 45, 117, 0.3);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      color: #b3004b;
      margin: 8px 0;
    }

    .sub {
      color: #7a4a5a;
      font-size: 17px;
      margin-bottom: 24px;
    }

    /* Кнопки */
    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 80px;
      align-items: center;
      position: relative;
    }

    .btn {
      border: none;
      padding: 14px 36px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      touch-action: none;
      user-select: none;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff2d75, #ff6b9d);
      color: white;
      box-shadow: 0 6px 0 #a8003b;
      position: relative;
      overflow: hidden;
    }

    .btn-yes:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #a8003b;
    }

    .btn-no {
      background: #e8e8e8;
      color: #444;
      box-shadow: 0 6px 0 #b0b0b0;
      position: relative;
      transition: left 0.15s ease, top 0.15s ease;
    }

    .btn-no:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b0b0b0;
    }

    /* Результат */
    .hidden {
      display: none;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #fff0f5, #ffe0eb);
      border-radius: 30px;
      animation: fadeIn 0.6s ease;
    }

    .result h2 {
      color: #b3004b;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .result .date {
      font-size: 18px;
      color: #7a4a5a;
    }

    .result .date strong {
      color: #ff2d75;
      font-size: 20px;
    }

    /* Анимация сердечек */
    .heart {
      position: fixed;
      font-size: 30px;
      pointer-events: none;
      z-index: 999;
      animation: floatHeart 3s ease-out forwards;
    }

    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-400px) scale(1.5) rotate(720deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Адаптив */
    @media (max-width: 480px) {
      .card {
        padding: 20px 16px 28px;
      }
      .photo {
        width: 100px;
        height: 100px;
      }
      h1 {
        font-size: 22px;
      }
      .btn {
        padding: 12px 28px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <!-- Фото -->
    <img 
      src="./asset/20250831_202808.jpg" 
      alt="Фото" 
      class="photo" 
      id="profilePhoto"
    />

    <!-- ===== ПЕРВЫЙ ЭКРАН ===== -->
    <div id="firstScreen">
      <h1>Ты пойдёшь со мной гулять сегодня? 💕</h1>
      <div class="sub">😊 я очень жду твоего ответа</div>

      <div class="buttons" id="btnWrapper">
        <button class="btn btn-yes" id="yesBtn">Да! 😍</button>
        <button class="btn btn-no" id="noBtn">Нет</button>
      </div>
    </div>

    <!-- ===== ВТОРОЙ ЭКРАН (РЕЗУЛЬТАТ) ===== -->
    <div id="result" class="result hidden">
      <h2>🥰 Ура! Я знала, что ты согласишься!</h2>
      <div style="margin-top: 12px; font-size: 16px; color: #7a4a5a;">
        Жду тебя дома вечером для обсуждения подробностей 💕
      </div>
    </div>
  </div>

  <script>
    // ========== 1. Убегающая кнопка ==========
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const result = document.getElementById('result');
    const wrapper = document.getElementById('btnWrapper');
    const firstScreen = document.getElementById('firstScreen');

    function escapeNoButton() {
      const wrapperRect = wrapper.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      const maxX = wrapperRect.width - noRect.width - 10;
      const maxY = wrapperRect.height - noRect.height - 10;

      if (maxX <= 0 || maxY <= 0) return;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = 'absolute';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseenter', escapeNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      escapeNoButton();
    });

    // ========== 2. Сердечки ==========
    function createHearts(count = 30) {
      const emojis = ['❤️', '💕', '💗', '💖', '💘', '💝', '♥️'];
      
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'heart';
          heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          heart.style.left = (Math.random() * 100) + 'vw';
          heart.style.top = (Math.random() * 30 + 70) + 'vh';
          heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
          heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 4000);
        }, i * 80);
      }
    }

    // ========== 3. Нажатие "Да" ==========
    yesBtn.addEventListener('click', () => {
      // Скрываем ПЕРВЫЙ экран полностью
      firstScreen.style.display = 'none';
      
      // Показываем результат (второй экран)
      result.classList.remove('hidden');
      
      createHearts(40);
      
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
    });

    // ========== 4. Telegram ==========
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ========== 5. Фото ==========
    if (tg) {
      const user = tg.initDataUnsafe?.user;
      if (user?.photo_url) {
        document.getElementById('profilePhoto').src = user.photo_url;
      }
    }
  </script>
</body>
</html>
